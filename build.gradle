plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.barofit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'com.barofit:barofit-runtime:0.0.1-SNAPSHOT'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // 프로필 사진 S3 저장소. 메모리를 줄이려고 Netty·Apache 대신 JDK URLConnection 클라이언트만 쓴다
    implementation platform('software.amazon.awssdk:bom:2.57.8')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    testFixturesImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 이 레포 자신의 컴포넌트/통합 테스트 (barofit-infra에서 이전, Testcontainers 기반)
    // classifier 방식(:test-fixtures)은 Maven POM 쪽에만 매핑되어 testFixturesApi의 전이
    // 의존성(Testcontainers 등)이 전달되지 않는다 -> capability로 명시해 Gradle Module
    // Metadata의 testFixtures variant를 제대로 선택한다
    integrationTestImplementation('com.barofit:barofit-runtime:0.0.1-SNAPSHOT') {
        capabilities {
            requireCapability('com.barofit:runtime-test-fixtures')
        }
    }
}

tasks.register('integrationTest', Test) {
    description = '이 레포 자신의 컴포넌트 통합 테스트 (Testcontainers, Docker 필요)'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
    jvmArgumentProviders.add(
        { ["-Dbarofit.test.postgres-image=postgres:18.6"] } as CommandLineArgumentProvider)
}

tasks.named('check') { dependsOn integrationTest }

tasks.named('test') { useJUnitPlatform() }

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
tasks.named('jar') { enabled = true }
tasks.named('bootJar') { archiveFileName = 'app.jar' }
tasks.named('bootRun') { workingDir = rootProject.projectDir }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'barofit-identity'
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    suppressedValidationErrors.add('dependencies-without-versions')
}
